name: Post Storybook Link to PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Sanitize branch name
        id: sanitize
        run: |
          SAFE_BRANCH="${{ github.head_ref }}"
          SAFE_BRANCH="${SAFE_BRANCH//\//-}"
          echo "branch=$SAFE_BRANCH" >> $GITHUB_OUTPUT
      - name: Comment with Storybook URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const storyBookUrl = `📖 **Storybook Preview**\n\n🔗 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branches/${{ steps.sanitize.outputs.branch }}/`;
            const botMarker = '<!-- storybook-preview-link -->';
            const body = `${botMarker}\n${storyBookUrl}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(comment => comment.body.includes(botMarker));

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
              console.log('✅ Updated existing Storybook link comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
              console.log('✅ Created new Storybook link comment');
            }
